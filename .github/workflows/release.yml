name: Package release

# Triggers when a GitHub Release is published. Also runnable manually.
#
# The plugin references Assembly-CSharp.dll (the game's proprietary
# assembly), which can't live on a public runner. The repo commits a
# PUBLICIZED stub (method signatures only, no IL) at
# VGShipyardDiscountFix/lib/Assembly-CSharp.dll. CI compiles against
# the stub; the real runtime assembly takes over in-game via Mono's
# late binding.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout repo at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify publicized references are committed
        run: |
          missing=0
          for stub in Assembly-CSharp.dll; do
            path="VGShipyardDiscountFix/lib/$stub"
            if [ ! -s "$path" ]; then
              echo "::error::$path is missing or empty. Regenerate via 'assembly-publicizer --strip <game>/$stub -o $path' and commit. (--strip is required.)"
              missing=1
            else
              echo "Publicized reference present: $path ($(du -h "$path" | cut -f1))"
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Build VGShipyardDiscountFix.dll
        run: dotnet build VGShipyardDiscountFix/VGShipyardDiscountFix.csproj -c Debug --nologo

      - name: Stage release layout
        id: stage
        run: |
          VERSION=$(grep 'PluginVersion =' VGShipyardDiscountFix/Plugin.cs | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_NAME="VGShipyardDiscountFix-v${VERSION}"
          # Nested VGShipyardDiscountFix/ is intentional: it's the folder the
          # user drops into BepInEx/plugins/.
          PKG_DIR="dist/${PKG_NAME}/VGShipyardDiscountFix"

          rm -rf "dist/${PKG_NAME}"
          mkdir -p "$PKG_DIR"

          cp VGShipyardDiscountFix/bin/Debug/netstandard2.1/VGShipyardDiscountFix.dll "$PKG_DIR/"
          [ -f README.md ] && cp README.md "$PKG_DIR/" || true
          [ -f LICENSE ] && cp LICENSE "$PKG_DIR/" || true

          SIZE=$(du -sh "$PKG_DIR" | cut -f1)
          echo "Staged DLL — $SIZE at $PKG_DIR"

          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Zip release bundle
        run: |
          (cd "dist/${{ steps.stage.outputs.pkg_name }}" && \
             zip -qr "../${{ steps.stage.outputs.pkg_name }}.zip" VGShipyardDiscountFix)
          ls -lh "dist/${{ steps.stage.outputs.pkg_name }}.zip"

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "dist/${{ steps.stage.outputs.pkg_name }}.zip" --clobber
          echo "Uploaded ${{ steps.stage.outputs.pkg_name }}.zip to release $TAG"
